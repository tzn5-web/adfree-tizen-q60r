name: TB8504 cloud lane lint

on:
  push:
    branches:
      - tb8504-android16-build
    paths:
      - "tb8504-build/**"
      - ".github/workflows/tb8504-*.yml"

permissions:
  contents: read

concurrency:
  group: tb8504-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate TB8504 cloud scripts
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Shell syntax
        shell: bash
        run: |
          set -o pipefail
          mapfile -t SHELL_FILES < <(find tb8504-build/scripts -maxdepth 1 -type f -name '*.sh' -print | sort)
          if [ "${#SHELL_FILES[@]}" -lt 3 ]; then
            echo "Unexpectedly few shell scripts: ${#SHELL_FILES[@]}" >&2
            exit 2
          fi
          for FILE in "${SHELL_FILES[@]}"; do
            echo "BASH_N=$FILE"
            bash -n "$FILE"
          done

      - name: Python syntax
        shell: bash
        run: |
          set -o pipefail
          mapfile -t PY_FILES < <(find tb8504-build/scripts -maxdepth 1 -type f -name '*.py' -print | sort)
          if [ "${#PY_FILES[@]}" -lt 3 ]; then
            echo "Unexpectedly few Python scripts: ${#PY_FILES[@]}" >&2
            exit 3
          fi
          python3 -m py_compile "${PY_FILES[@]}"
          for f in "${PY_FILES[@]}"; do
            python3 - "$f" <<'PY'
          import runpy
          import sys
          path = sys.argv[1]
          runpy.run_path(path, run_name="__tb8504_import_audit__")
          PY
          done

      - name: Repository consistency
        shell: bash
        run: |
          set -o pipefail
          git diff --check HEAD^ HEAD
          test -f tb8504-build/config/sources.env
          test -f tb8504-build/config/boot-tools.env
          grep -Fx 'BOOT_PARTITION_SIZE=67108864' tb8504-build/config/sources.env
          grep -Fx 'RECOVERY_PARTITION_SIZE=67108864' tb8504-build/config/sources.env
          grep -Fx 'SYSTEM_PARTITION_SIZE=4080218112' tb8504-build/config/sources.env
          grep -Fx 'BOOT_PARTITION_SIZE=67108864' tb8504-build/config/boot-tools.env
          grep -Fx 'EXPECTED_MODULE_COUNT=12' tb8504-build/config/sources.env

      - name: Safety policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tb8504-build/scripts/audit-script-safety.py
          if git ls-files 'tb8504-build/seeds/*' | grep -q .; then
            echo "Tracked seed payload found" >&2
            exit 20
          fi
          if git ls-files 'tb8504-build/out/*' | grep -q .; then
            echo "Tracked build output found" >&2
            exit 21
          fi
          if find tb8504-build -type f \
              -not -path '*/requests/*' \
              -not -path '*/README.md' \
              -not -path '*/CLOUD_SEED.md' \
              -not -path '*/__pycache__/*' \
              -print0 | \
              xargs -0 grep -IlE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' | \
              grep -q .; then
            echo "Credential-like token found in tracked tooling" >&2
            exit 22
          fi

      - name: Autopilot self-test
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/tb8504-autopilot.py --self-test

      - name: Radio runtime compatibility self-test
        shell: bash
        run: python3 tb8504-build/scripts/self-test-radio-runtime-compat.py

      - name: Kernel module file-list compatibility self-test
        shell: bash
        run: python3 tb8504-build/scripts/self-test-kernel-filelist-compat.py

      - name: Azure control fixture self-test
        shell: bash
        run: python3 tb8504-build/cloud/self-test-cloud-controls.py

      - name: Audio header compatibility self-test
        shell: bash
        run: python3 tb8504-build/scripts/self-test-audio-header-compat.py

      - name: Camera compatibility self-test
        shell: bash
        run: python3 tb8504-build/scripts/self-test-camera-compat.py

      - name: Helper behavior self-tests
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/device"
          cat > "$TMP/device/vendor_prop.mk" <<'EOF'
          PRODUCT_VENDOR_PROPERTIES += \
              ro.surface_flinger.supports_background_blur=1 \
              debug.sf.disable_backpressure=1 \
              debug.egl.hw=0 \
              debug.sf.hw=0 \
              debug.hwui.use_buffer_age=false \
              ro.config.avoid_gfx_accel=true
          EOF

          python3 tb8504-build/scripts/apply-performance-compat.py \
            --device "$TMP/device" \
            --patch-out "$TMP/perf-first.patch" \
            --report-out "$TMP/perf-first.txt"
          grep -Fx 'PERFORMANCE_COMPAT_STATE=APPLIED' "$TMP/perf-first.txt"
          grep -Fx 'CHANGED_FILES=1' "$TMP/perf-first.txt"

          python3 tb8504-build/scripts/apply-performance-compat.py \
            --device "$TMP/device" \
            --patch-out "$TMP/perf-second.patch" \
            --report-out "$TMP/perf-second.txt"
          grep -Fx 'PERFORMANCE_COMPAT_STATE=ALREADY_APPLIED' "$TMP/perf-second.txt"
          grep -Fx 'CHANGED_FILES=0' "$TMP/perf-second.txt"
          test ! -s "$TMP/perf-second.patch"

          python3 tb8504-build/scripts/audit-performance-compat.py \
            --device "$TMP/device" |
            grep -Fx 'TB8504_PERFORMANCE_SOURCE_AUDIT=PASS'

          python3 - <<'PY'
          import runpy
          pkg=runpy.run_path(
              "tb8504-build/scripts/audit-final-package.py",
              run_name="__tb8504_final_package_selftest__",
          )
          parse_ranges=pkg["parse_ranges"]
          assert parse_ranges("4,0,2,4,8") == [(0,2),(4,8)]
          try:
              parse_ranges("3,0,2,4")
          except SystemExit as exc:
              assert exc.code == 2
          else:
              raise AssertionError("malformed transfer range was accepted")

          img=runpy.run_path(
              "tb8504-build/scripts/audit-local-image.py",
              run_name="__tb8504_local_image_selftest__",
          )
          import io
          import contextlib
          import tempfile
          from pathlib import Path
          base_release = {
              "TARGET_RELEASE": "trunk_staging",
              "TARGET_PRODUCT": "lineage_TB8504",
              "TARGET_VARIANT": "userdebug",
              "PLATFORM_SDK_VERSION": "36",
              "PLATFORM_VERSION": "Baklava",
              "LINEAGE_VERSION": "23.2-test-UNOFFICIAL-TB8504",
          }
          with tempfile.TemporaryDirectory() as tmp:
              report = Path(tmp) / "release.txt"
              cases = [
                  ({"PLATFORM_VERSION": "16"}, True),
                  ({"PLATFORM_VERSION": "Baklava"}, True),
                  ({"PLATFORM_VERSION": "160"}, False),
                  ({"PLATFORM_VERSION": "16-preview"}, False),
                  ({"PLATFORM_VERSION": "15"}, False),
                  ({"PLATFORM_VERSION": "CinnamonBun"}, False),
                  ({"PLATFORM_VERSION": ""}, False),
                  ({"PLATFORM_SDK_VERSION": "35"}, False),
                  ({"PLATFORM_VERSION": "16", "PLATFORM_SDK_VERSION": "37"}, False),
                  ({"TARGET_PRODUCT": "lineage_other"}, False),
                  ({"TARGET_RELEASE": "other"}, False),
                  ({"TARGET_VARIANT": "user"}, False),
                  ({"LINEAGE_VERSION": "22.2-test"}, False),
              ]
              for overrides, wanted in cases:
                  values = {**base_release, **overrides}
                  report.write_text("".join(f"{k}={v}\n" for k, v in values.items()))
                  with contextlib.redirect_stdout(io.StringIO()):
                      try:
                          img["read_release_report"](report)
                      except SystemExit as exc:
                          assert exc.code == 2
                          accepted = False
                      else:
                          accepted = True
                  assert accepted == wanted, (overrides, accepted, wanted)
          print("ANDROID16_IMAGE_RELEASE_GATE_SELFTEST=PASS")
          assert img["EXPECTED_DTB"] == "tb8504-msm8917-pmi8937-qrd-sku5.dtb"
          assert "CONFIG_MODULE_SIG_FORCE=y" in img["REQUIRED_KERNEL_CONFIG"]
          assert "androidboot.bootdevice=7824900.sdhci" in img["REQUIRED_CMDLINE_TOKENS"]
          print("TB8504_HELPER_BEHAVIOR_SELFTEST=PASS")
          PY

      - name: Golden profile transform self-test
        shell: bash
        run: |
          python3 - <<'PY'
          import runpy
          mod = runpy.run_path("tb8504-build/scripts/apply-golden-profile.py", run_name="golden_test")
          before = "#!/vendor/bin/sh\nfunction 8917_sched_dcvs_hmp() { :; }\n"
          after = mod["transform"](before)
          assert mod["transform"](after) == after
          assert after.endswith(mod["golden_block"]())
          assert "thermal/core_control/enabled" not in mod["golden_block"]()
          for bad in ("unexpected script", after + "echo overwrite\n", after.replace("'85'", "'75'"), after + mod["golden_block"]()):
              try:
                  mod["transform"](bad)
              except SystemExit:
                  pass
              else:
                  raise AssertionError("ambiguous golden source accepted")
          import tempfile
          import subprocess
          import contextlib
          import io
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              target = Path(tmp) / "node"
              target.write_text("")
              script = 'getprop() { printf "other"; }\n' + mod["golden_block"]() + f"tb8504_golden_write '{target}' '19000 1094400:39000'\n"
              subprocess.run(["bash"], input=script, text=True, check=True)
              assert target.read_text() == "19000 1094400:39000\n"
              built = runpy.run_path("tb8504-build/scripts/audit-built-output.py", run_name="golden_built_test")
              out = Path(tmp) / "out"
              post = out / "system/vendor/bin/init.qcom.post_boot.sh"
              post.parent.mkdir(parents=True)
              post.write_text(after)
              with contextlib.redirect_stdout(io.StringIO()):
                  built["audit_golden_profile"](out)
              post.write_text(before)
              try:
                  built["audit_golden_profile"](out)
              except SystemExit:
                  pass
              else:
                  raise AssertionError("built golden profile missing was accepted")
              prop = out / "system/build.prop"
              props = {
                  "ro.build.version.sdk": "36", "ro.build.version.release_or_codename": "Baklava",
                  "ro.surface_flinger.supports_background_blur": "0", "ro.config.avoid_gfx_accel": "true",
                  "dalvik.vm.heapstartsize": "16m", "dalvik.vm.heapgrowthlimit": "192m",
                  "dalvik.vm.heapsize": "512m", "dalvik.vm.heaptargetutilization": "0.75",
                  "dalvik.vm.heapminfree": "2m", "dalvik.vm.heapmaxfree": "8m",
              }
              for overrides, wanted in [({}, True), ({"ro.build.version.release_or_codename": "16"}, True), ({"ro.build.version.release_or_codename": "160"}, False), ({"ro.build.version.sdk": "36x"}, False), ({"dalvik.vm.heapgrowthlimit": "384m"}, False)]:
                  prop.write_text("".join(f"{k}={v}\n" for k, v in {**props, **overrides}.items()))
                  with contextlib.redirect_stdout(io.StringIO()):
                      try:
                          built["audit_build_props"](out)
                      except SystemExit:
                          accepted = False
                      else:
                          accepted = True
                  assert accepted == wanted, overrides
          print("TB8504_GOLDEN_PROFILE_SELFTEST=PASS")
          PY

      - name: Shared kernel pair self-test
        shell: bash
        run: python3 tb8504-build/scripts/self-test-autopilot-pair.py

      - name: Local image regression self-test
        shell: bash
        run: python3 tb8504-build/scripts/self-test-local-image.py

      - name: Provenance promotion self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import subprocess
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          def h(data):
              return hashlib.sha256(data).hexdigest()

          tooling="4"*40
          request="5"*40
          dev_head="1"*40
          vendor_head="2"*40
          gps_head="3"*40
          static_rel="hardware/qcom-caf/msm8996/audio"
          static_head="6"*40
          manifests="0"*64
          projects=[
              {"path":"device/lenovo/TB8504","head":dev_head,"dirty":True},
              {"path":"vendor/lenovo/TB8504","head":vendor_head,"dirty":True},
              {"path":"hardware/qcom-caf/msm8996/gps","head":gps_head,"dirty":True},
              {"path":static_rel,"head":static_head,"dirty":True},
          ]
          wh=hashlib.sha256()
          for row in sorted(projects,key=lambda x:x["path"]):
              wh.update(row["path"].encode()+b"\0")
              wh.update(row["head"].encode()+b"\0")
          wh.update(b"LOCAL_MANIFESTS\0"+manifests.encode()+b"\0")
          workspace={
              "project_count":len(projects),
              "revision_fingerprint":wh.hexdigest(),
              "local_manifests_sha256":manifests,
              "unexpected_dirty_repos":[],
              "projects":projects,
          }

          patches={
              "device/lenovo/TB8504":b"device patch\n",
              "vendor/lenovo/TB8504":b"vendor patch\n",
              "hardware/qcom-caf/msm8996/gps":b"gps patch\n",
              static_rel:b"static patch\n",
          }
          static={
              static_rel:{
                  "head":static_head,
                  "patch_sha256":h(patches[static_rel]),
                  "status":[" M Android.bp"],
                  "untracked":[],
              }
          }
          empty=h(b"")
          dev_untracked_rel="rootdir/etc/tb8504-selftest.txt"
          dev_untracked_data=b"provenance bytes\n"
          dev_untracked_digest=h(dev_untracked_data)
          dev_untracked_mode=0o755
          dev_untracked_row={
              "path":dev_untracked_rel,
              "type":"file",
              "mode":dev_untracked_mode,
              "size":len(dev_untracked_data),
              "sha256":dev_untracked_digest,
          }
          uh=hashlib.sha256()
          uh.update(dev_untracked_rel.encode()+b"\0")
          uh.update(
              b"F\0"
              + str(dev_untracked_mode).encode()
              + b"\0"
              + str(len(dev_untracked_data)).encode()
              + b"\0"
              + dev_untracked_digest.encode()
          )
          dev_untracked_manifest=uh.hexdigest()
          primary={
              "device/lenovo/TB8504":{
                  "head":dev_head,
                  "patch_sha256":h(patches["device/lenovo/TB8504"]),
                  "untracked_manifest_sha256":dev_untracked_manifest,
                  "untracked":[dev_untracked_row],
                  "status":[],
              },
              "vendor/lenovo/TB8504":{
                  "head":vendor_head,
                  "patch_sha256":h(patches["vendor/lenovo/TB8504"]),
                  "untracked_manifest_sha256":empty,
                  "untracked":[],
                  "status":[],
              },
          }
          gps={
              "path":"hardware/qcom-caf/msm8996/gps",
              "mode":"git",
              "head":gps_head,
              "patch_sha256":h(patches["hardware/qcom-caf/msm8996/gps"]),
              "untracked_manifest_sha256":empty,
              "untracked":[],
              "status":[],
          }
          knowledge={
              "source_integrity_contracts":{
                  "required_unproven_repo":"hardware/qcom-caf/msm8996/gps",
                  "static_target_repos":{
                      static_rel:{
                          "head":static_head,
                          "patch_sha256":h(patches[static_rel]),
                      }
                  },
                  "dynamic_primary_repos":{
                      "device/lenovo/TB8504":{
                          "head":dev_head,
                          "post_converge_patch_sha256":None,
                          "post_converge_untracked_manifest_sha256":None,
                      },
                      "vendor/lenovo/TB8504":{
                          "head":vendor_head,
                          "post_converge_patch_sha256":None,
                          "post_converge_untracked_manifest_sha256":None,
                      },
                  },
                  "workspace_repo_contract":{
                      "revision_fingerprint":None,
                      "expected_project_count":None,
                  },
              },
              "cloud_seed":{},
          }

          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              seed=td/"seed.zip"
              kin=td/"knowledge.json"
              kout=td/"accepted.json"
              kin.write_text(json.dumps(knowledge))
              with zipfile.ZipFile(seed,"w") as z:
                  z.writestr("meta/EXPORT.txt",f"TOOLING_REF={tooling}\n")
                  z.writestr("meta/workspace-source-state.json",json.dumps(workspace))
                  z.writestr("meta/gps-source-state.json",json.dumps(gps))
                  z.writestr("meta/primary-source-state.json",json.dumps(primary))
                  z.writestr("meta/static-source-state.json",json.dumps(static))
                  for rel,data in patches.items():
                      z.writestr("patches/"+rel.replace("/","__")+".patch",data)
                  info=zipfile.ZipInfo(
                      "untracked/device/lenovo/TB8504/"+dev_untracked_rel
                  )
                  info.create_system=3
                  info.external_attr=(dev_untracked_mode & 0xFFFF) << 16
                  z.writestr(info,dev_untracked_data)
              p=subprocess.run([
                  "python3","tb8504-build/scripts/accept-converged-provenance.py",
                  "--seed",str(seed),
                  "--knowledge",str(kin),
                  "--out",str(kout),
                  "--release-tag","tb8504-selftest",
                  "--request-commit",request,
                  "--tooling-ref",tooling,
              ],text=True,capture_output=True)
              if p.returncode != 0:
                  raise SystemExit(p.stdout+"\n"+p.stderr)
              assert "PROVENANCE_ACCEPTANCE_CANDIDATE=PASS" in p.stdout
              out=json.loads(kout.read_text())
              sic=out["source_integrity_contracts"]
              assert sic["gps_repo"]["head"] == gps_head
              assert sic["static_target_repos"][static_rel]["head"] == static_head
              assert sic["workspace_repo_contract"]["revision_fingerprint"] == workspace["revision_fingerprint"]
              assert sic["dynamic_primary_repos"]["device/lenovo/TB8504"]["post_converge_patch_sha256"] == primary["device/lenovo/TB8504"]["patch_sha256"]
              assert sic["dynamic_primary_repos"]["device/lenovo/TB8504"]["post_converge_untracked_manifest_sha256"] == dev_untracked_manifest
              assert out["cloud_seed"]["legacy_seed_only"] is False

              # Actual TB8504 layout: external GPS checkout absent, GNSS source
              # included in device tree and therefore in device provenance.
              bundled_workspace=json.loads(json.dumps(workspace))
              bundled_projects=[
                  p for p in projects
                  if p["path"] != "hardware/qcom-caf/msm8996/gps"
              ]
              wh2=hashlib.sha256()
              for row in sorted(bundled_projects,key=lambda x:x["path"]):
                  wh2.update(row["path"].encode()+b"\0")
                  wh2.update(row["head"].encode()+b"\0")
              wh2.update(b"LOCAL_MANIFESTS\0"+manifests.encode()+b"\0")
              bundled_workspace["projects"]=bundled_projects
              bundled_workspace["project_count"]=len(bundled_projects)
              bundled_workspace["revision_fingerprint"]=wh2.hexdigest()
              bundled_gps={
                  "path":"hardware/qcom-caf/msm8996/gps",
                  "mode":"absent",
                  "exists":False,
                  "is_dir":False,
              }
              def device_tar(complete):
                  buf=io.BytesIO()
                  with tarfile.open(fileobj=buf,mode="w:gz") as tf:
                      names=[
                          "TB8504/gps/android/Android.mk",
                          "TB8504/gps/core/Android.mk",
                          "TB8504/gps/utils/Android.mk",
                      ]
                      for name in names if complete else names[:-1]:
                          data=b"LOCAL_PATH := $(call my-dir)\n"
                          info=tarfile.TarInfo(name)
                          info.size=len(data)
                          info.mode=0o644
                          tf.addfile(info,io.BytesIO(data))
                  return buf.getvalue()
              bundled_seed=td/"seed-bundled-gnss.zip"
              with zipfile.ZipFile(seed) as src,zipfile.ZipFile(bundled_seed,"w") as dst:
                  for info in src.infolist():
                      if info.filename == "patches/hardware__qcom-caf__msm8996__gps.patch":
                          continue
                      data=src.read(info.filename)
                      if info.filename=="meta/workspace-source-state.json":
                          data=json.dumps(bundled_workspace).encode()
                      elif info.filename=="meta/gps-source-state.json":
                          data=json.dumps(bundled_gps).encode()
                      dst.writestr(info,data)
                  dst.writestr("device_lenovo_TB8504.tar.gz",device_tar(True))
              bundled_output=td/"accepted-bundled.json"
              bundled_run=subprocess.run([
                  "python3","tb8504-build/scripts/accept-converged-provenance.py",
                  "--seed",str(bundled_seed),
                  "--knowledge",str(kin),
                  "--out",str(bundled_output),
                  "--release-tag","tb8504-selftest",
                  "--request-commit",request,
                  "--tooling-ref",tooling,
              ],text=True,capture_output=True)
              if bundled_run.returncode!=0:
                  raise SystemExit(bundled_run.stdout+"\n"+bundled_run.stderr)
              assert json.loads(bundled_output.read_text())[
                  "source_integrity_contracts"
              ]["gps_repo"] == {
                  "mode":"absent",
                  "source":"device/lenovo/TB8504/gps",
              }
              incomplete_seed=td/"seed-incomplete-gnss.zip"
              with zipfile.ZipFile(bundled_seed) as src,zipfile.ZipFile(incomplete_seed,"w") as dst:
                  for info in src.infolist():
                      data=src.read(info.filename)
                      if info.filename=="device_lenovo_TB8504.tar.gz":
                          data=device_tar(False)
                      dst.writestr(info,data)
              incomplete_run=subprocess.run([
                  "python3","tb8504-build/scripts/accept-converged-provenance.py",
                  "--seed",str(incomplete_seed),
                  "--knowledge",str(kin),
                  "--out",str(td/"should-not-accept-incomplete-gnss.json"),
                  "--release-tag","tb8504-selftest",
                  "--request-commit",request,
                  "--tooling-ref",tooling,
              ],text=True,capture_output=True)
              assert incomplete_run.returncode!=0
              assert "bundled GNSS source incomplete" in (
                  incomplete_run.stdout+incomplete_run.stderr
              )

              bad_seed=td/"seed-tampered.zip"
              with zipfile.ZipFile(seed) as src, zipfile.ZipFile(bad_seed,"w") as dst:
                  for info in src.infolist():
                      data=src.read(info.filename)
                      if info.filename == "untracked/device/lenovo/TB8504/"+dev_untracked_rel:
                          data=b"tampered bytes\n"
                      dst.writestr(info, data)
              bad_static=td/"seed-bad-static.zip"
              with zipfile.ZipFile(seed) as src, zipfile.ZipFile(bad_static,"w") as dst:
                  for info in src.infolist():
                      data=src.read(info.filename)
                      if info.filename == "patches/"+static_rel.replace("/","__")+".patch":
                          data=b"tampered static patch\n"
                      dst.writestr(info,data)
              bad_static_run=subprocess.run([
                  "python3","tb8504-build/scripts/accept-converged-provenance.py",
                  "--seed",str(bad_static),
                  "--knowledge",str(kin),
                  "--out",str(td/"should-not-exist-static.json"),
                  "--release-tag","tb8504-selftest",
                  "--request-commit",request,
                  "--tooling-ref",tooling,
              ],text=True,capture_output=True)
              assert bad_static_run.returncode != 0
              assert "static source patch bytes disagree" in (
                  bad_static_run.stdout+bad_static_run.stderr
              )

              bad_mode_seed=td/"seed-bad-mode.zip"
              with zipfile.ZipFile(seed) as src, zipfile.ZipFile(bad_mode_seed,"w") as dst:
                  for info in src.infolist():
                      data=src.read(info.filename)
                      out_info=zipfile.ZipInfo(info.filename)
                      out_info.create_system=3
                      mode=(info.external_attr >> 16) & 0o7777
                      if info.filename == "untracked/device/lenovo/TB8504/"+dev_untracked_rel:
                          mode=0o644
                      out_info.external_attr=(mode & 0xFFFF) << 16
                      dst.writestr(out_info,data)
              bad_mode=subprocess.run([
                  "python3","tb8504-build/scripts/accept-converged-provenance.py",
                  "--seed",str(bad_mode_seed),
                  "--knowledge",str(kin),
                  "--out",str(td/"should-not-exist-mode.json"),
                  "--release-tag","tb8504-selftest",
                  "--request-commit",request,
                  "--tooling-ref",tooling,
              ],text=True,capture_output=True)
              assert bad_mode.returncode != 0
              assert "untracked file mode mismatch" in (bad_mode.stdout+bad_mode.stderr)

              bad=subprocess.run([
                  "python3","tb8504-build/scripts/accept-converged-provenance.py",
                  "--seed",str(bad_seed),
                  "--knowledge",str(kin),
                  "--out",str(td/"should-not-exist.json"),
                  "--release-tag","tb8504-selftest",
                  "--request-commit",request,
                  "--tooling-ref",tooling,
              ],text=True,capture_output=True)
              assert bad.returncode != 0
              assert "untracked file content mismatch" in (bad.stdout+bad.stderr)
          print("TB8504_PROVENANCE_PROMOTION_SELFTEST=PASS")
          PY

      - name: Cloud lane summary
        shell: bash
        run: |
          echo 'TB8504_LINT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "COMMIT=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'NO_FLASH=YES' >> "$GITHUB_STEP_SUMMARY"
