name: TB8504 cloud lane lint

on:
  push:
    branches:
      - tb8504-android16-build
    paths:
      - "tb8504-build/**"
      - ".github/workflows/tb8504-*.yml"

permissions:
  contents: read

concurrency:
  group: tb8504-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Validate TB8504 cloud scripts
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Shell syntax
        shell: bash
        run: |
          set -o pipefail
          mapfile -t SHELL_FILES < <(find tb8504-build/scripts -maxdepth 1 -type f -name '*.sh' -print | sort)
          if [ "${#SHELL_FILES[@]}" -lt 3 ]; then
            echo "Unexpectedly few shell scripts: ${#SHELL_FILES[@]}" >&2
            exit 2
          fi
          for FILE in "${SHELL_FILES[@]}"; do
            echo "BASH_N=$FILE"
            bash -n "$FILE"
          done

      - name: Python syntax
        shell: bash
        run: |
          set -o pipefail
          mapfile -t PY_FILES < <(find tb8504-build/scripts -maxdepth 1 -type f -name '*.py' -print | sort)
          if [ "${#PY_FILES[@]}" -lt 3 ]; then
            echo "Unexpectedly few Python scripts: ${#PY_FILES[@]}" >&2
            exit 3
          fi
          python3 -m py_compile "${PY_FILES[@]}"
          for f in "${PY_FILES[@]}"; do
            python3 - "$f" <<'PY'
          import runpy
          import sys
          path = sys.argv[1]
          runpy.run_path(path, run_name="__tb8504_import_audit__")
          PY
          done

      - name: Repository consistency
        shell: bash
        run: |
          set -o pipefail
          git diff --check HEAD^ HEAD
          test -f tb8504-build/config/sources.env
          test -f tb8504-build/config/boot-tools.env
          grep -Fx 'BOOT_PARTITION_SIZE=67108864' tb8504-build/config/sources.env
          grep -Fx 'RECOVERY_PARTITION_SIZE=67108864' tb8504-build/config/sources.env
          grep -Fx 'SYSTEM_PARTITION_SIZE=4080218112' tb8504-build/config/sources.env
          grep -Fx 'BOOT_PARTITION_SIZE=67108864' tb8504-build/config/boot-tools.env
          grep -Fx 'EXPECTED_MODULE_COUNT=12' tb8504-build/config/sources.env

      - name: Safety policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tb8504-build/scripts/audit-script-safety.py
          if git ls-files 'tb8504-build/seeds/*' | grep -q .; then
            echo "Tracked seed payload found" >&2
            exit 20
          fi
          if git ls-files 'tb8504-build/out/*' | grep -q .; then
            echo "Tracked build output found" >&2
            exit 21
          fi
          if find tb8504-build -type f \
              -not -path '*/requests/*' \
              -not -path '*/README.md' \
              -not -path '*/CLOUD_SEED.md' \
              -not -path '*/__pycache__/*' \
              -print0 | \
              xargs -0 grep -IlE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' | \
              grep -q .; then
            echo "Credential-like token found in tracked tooling" >&2
            exit 22
          fi

      - name: Autopilot self-test
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/tb8504-autopilot.py --self-test

      - name: Helper behavior self-tests
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/device"
          cat > "$TMP/device/vendor_prop.mk" <<'EOF'
          PRODUCT_VENDOR_PROPERTIES += \
              ro.surface_flinger.supports_background_blur=1 \
              debug.sf.disable_backpressure=1 \
              debug.egl.hw=0 \
              debug.sf.hw=0 \
              debug.hwui.use_buffer_age=false \
              ro.config.avoid_gfx_accel=true
          EOF

          python3 tb8504-build/scripts/apply-performance-compat.py \
            --device "$TMP/device" \
            --patch-out "$TMP/perf-first.patch" \
            --report-out "$TMP/perf-first.txt"
          grep -Fx 'PERFORMANCE_COMPAT_STATE=APPLIED' "$TMP/perf-first.txt"
          grep -Fx 'CHANGED_FILES=1' "$TMP/perf-first.txt"

          python3 tb8504-build/scripts/apply-performance-compat.py \
            --device "$TMP/device" \
            --patch-out "$TMP/perf-second.patch" \
            --report-out "$TMP/perf-second.txt"
          grep -Fx 'PERFORMANCE_COMPAT_STATE=ALREADY_APPLIED' "$TMP/perf-second.txt"
          grep -Fx 'CHANGED_FILES=0' "$TMP/perf-second.txt"
          test ! -s "$TMP/perf-second.patch"

          python3 tb8504-build/scripts/audit-performance-compat.py \
            --device "$TMP/device" |
            grep -Fx 'TB8504_PERFORMANCE_SOURCE_AUDIT=PASS'

          python3 - <<'PY'
          import runpy
          pkg=runpy.run_path(
              "tb8504-build/scripts/audit-final-package.py",
              run_name="__tb8504_final_package_selftest__",
          )
          parse_ranges=pkg["parse_ranges"]
          assert parse_ranges("4,0,2,4,8") == [(0,2),(4,8)]
          try:
              parse_ranges("3,0,2,4")
          except SystemExit as exc:
              assert exc.code == 2
          else:
              raise AssertionError("malformed transfer range was accepted")

          img=runpy.run_path(
              "tb8504-build/scripts/audit-local-image.py",
              run_name="__tb8504_local_image_selftest__",
          )
          assert img["EXPECTED_DTB"] == "tb8504-msm8917-pmi8937-qrd-sku5.dtb"
          assert "CONFIG_MODULE_SIG_FORCE=y" in img["REQUIRED_KERNEL_CONFIG"]
          assert "androidboot.bootdevice=7824900.sdhci" in img["REQUIRED_CMDLINE_TOKENS"]
          print("TB8504_HELPER_BEHAVIOR_SELFTEST=PASS")
          PY

      - name: Provenance promotion self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          def h(data):
              return hashlib.sha256(data).hexdigest()

          tooling="4"*40
          request="5"*40
          dev_head="1"*40
          vendor_head="2"*40
          gps_head="3"*40
          manifests="0"*64
          projects=[
              {"path":"device/lenovo/TB8504","head":dev_head,"dirty":True},
              {"path":"vendor/lenovo/TB8504","head":vendor_head,"dirty":True},
              {"path":"hardware/qcom-caf/msm8996/gps","head":gps_head,"dirty":True},
          ]
          wh=hashlib.sha256()
          for row in sorted(projects,key=lambda x:x["path"]):
              wh.update(row["path"].encode()+b"\0")
              wh.update(row["head"].encode()+b"\0")
          wh.update(b"LOCAL_MANIFESTS\0"+manifests.encode()+b"\0")
          workspace={
              "project_count":len(projects),
              "revision_fingerprint":wh.hexdigest(),
              "local_manifests_sha256":manifests,
              "unexpected_dirty_repos":[],
              "projects":projects,
          }

          patches={
              "device/lenovo/TB8504":b"device patch\n",
              "vendor/lenovo/TB8504":b"vendor patch\n",
              "hardware/qcom-caf/msm8996/gps":b"gps patch\n",
          }
          empty=h(b"")
          dev_untracked_rel="rootdir/etc/tb8504-selftest.txt"
          dev_untracked_data=b"provenance bytes\n"
          dev_untracked_digest=h(dev_untracked_data)
          dev_untracked_row={
              "path":dev_untracked_rel,
              "type":"file",
              "size":len(dev_untracked_data),
              "sha256":dev_untracked_digest,
          }
          uh=hashlib.sha256()
          uh.update(dev_untracked_rel.encode()+b"\0")
          uh.update(
              b"F\0"
              + str(len(dev_untracked_data)).encode()
              + b"\0"
              + dev_untracked_digest.encode()
          )
          dev_untracked_manifest=uh.hexdigest()
          primary={
              "device/lenovo/TB8504":{
                  "head":dev_head,
                  "patch_sha256":h(patches["device/lenovo/TB8504"]),
                  "untracked_manifest_sha256":dev_untracked_manifest,
                  "untracked":[dev_untracked_row],
                  "status":[],
              },
              "vendor/lenovo/TB8504":{
                  "head":vendor_head,
                  "patch_sha256":h(patches["vendor/lenovo/TB8504"]),
                  "untracked_manifest_sha256":empty,
                  "untracked":[],
                  "status":[],
              },
          }
          gps={
              "path":"hardware/qcom-caf/msm8996/gps",
              "mode":"git",
              "head":gps_head,
              "patch_sha256":h(patches["hardware/qcom-caf/msm8996/gps"]),
              "untracked_manifest_sha256":empty,
              "untracked":[],
              "status":[],
          }
          knowledge={
              "source_integrity_contracts":{
                  "required_unproven_repo":"hardware/qcom-caf/msm8996/gps",
                  "dynamic_primary_repos":{
                      "device/lenovo/TB8504":{
                          "head":dev_head,
                          "post_converge_patch_sha256":None,
                          "post_converge_untracked_manifest_sha256":None,
                      },
                      "vendor/lenovo/TB8504":{
                          "head":vendor_head,
                          "post_converge_patch_sha256":None,
                          "post_converge_untracked_manifest_sha256":None,
                      },
                  },
                  "workspace_repo_contract":{
                      "revision_fingerprint":None,
                      "expected_project_count":None,
                  },
              },
              "cloud_seed":{},
          }

          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              seed=td/"seed.zip"
              kin=td/"knowledge.json"
              kout=td/"accepted.json"
              kin.write_text(json.dumps(knowledge))
              with zipfile.ZipFile(seed,"w") as z:
                  z.writestr("meta/EXPORT.txt",f"TOOLING_REF={tooling}\n")
                  z.writestr("meta/workspace-source-state.json",json.dumps(workspace))
                  z.writestr("meta/gps-source-state.json",json.dumps(gps))
                  z.writestr("meta/primary-source-state.json",json.dumps(primary))
                  for rel,data in patches.items():
                      z.writestr("patches/"+rel.replace("/","__")+".patch",data)
                  z.writestr(
                      "untracked/device/lenovo/TB8504/"+dev_untracked_rel,
                      dev_untracked_data,
                  )
              p=subprocess.run([
                  "python3","tb8504-build/scripts/accept-converged-provenance.py",
                  "--seed",str(seed),
                  "--knowledge",str(kin),
                  "--out",str(kout),
                  "--release-tag","tb8504-selftest",
                  "--request-commit",request,
                  "--tooling-ref",tooling,
              ],text=True,capture_output=True)
              if p.returncode != 0:
                  raise SystemExit(p.stdout+"\n"+p.stderr)
              assert "PROVENANCE_ACCEPTANCE_CANDIDATE=PASS" in p.stdout
              out=json.loads(kout.read_text())
              sic=out["source_integrity_contracts"]
              assert sic["gps_repo"]["head"] == gps_head
              assert sic["workspace_repo_contract"]["revision_fingerprint"] == workspace["revision_fingerprint"]
              assert sic["dynamic_primary_repos"]["device/lenovo/TB8504"]["post_converge_patch_sha256"] == primary["device/lenovo/TB8504"]["patch_sha256"]
              assert sic["dynamic_primary_repos"]["device/lenovo/TB8504"]["post_converge_untracked_manifest_sha256"] == dev_untracked_manifest
              assert out["cloud_seed"]["legacy_seed_only"] is False

              bad_seed=td/"seed-tampered.zip"
              with zipfile.ZipFile(seed) as src, zipfile.ZipFile(bad_seed,"w") as dst:
                  for info in src.infolist():
                      data=src.read(info.filename)
                      if info.filename == "untracked/device/lenovo/TB8504/"+dev_untracked_rel:
                          data=b"tampered bytes\n"
                      dst.writestr(info, data)
              bad=subprocess.run([
                  "python3","tb8504-build/scripts/accept-converged-provenance.py",
                  "--seed",str(bad_seed),
                  "--knowledge",str(kin),
                  "--out",str(td/"should-not-exist.json"),
                  "--release-tag","tb8504-selftest",
                  "--request-commit",request,
                  "--tooling-ref",tooling,
              ],text=True,capture_output=True)
              assert bad.returncode != 0
              assert "untracked file content mismatch" in (bad.stdout+bad.stderr)
          print("TB8504_PROVENANCE_PROMOTION_SELFTEST=PASS")
          PY

      - name: Cloud lane summary
        shell: bash
        run: |
          echo 'TB8504_LINT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "COMMIT=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'NO_FLASH=YES' >> "$GITHUB_STEP_SUMMARY"
