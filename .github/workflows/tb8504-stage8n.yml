name: TB8504 STAGE8N source ELF audit

on:
  push:
    branches:
      - tb8504-android16-build
    paths:
      - "tb8504-build/requests/live/stage8n-*.txt"

permissions:
  contents: write
  actions: read

concurrency:
  group: tb8504-stage8n-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage8n:
    name: Reconstruct exported source state and audit ELF dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact request commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Read triggering STAGE8N request
        shell: bash
        run: |
          set -o pipefail
          mapfile -t REQUESTS < <(
            git diff-tree --root --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep -E '^tb8504-build/requests/live/stage8n-[A-Za-z0-9._-]+[.]txt$' || true
          )
          if [ "${#REQUESTS[@]}" -ne 1 ]; then
            echo "Expected exactly one STAGE8N request; found ${#REQUESTS[@]}" >&2
            exit 2
          fi
          REQUEST="${REQUESTS[0]}"
          if grep -Ev '^(SEED_RELEASE_TAG|SEED_ZIP_SHA256)=[A-Za-z0-9._:-]+$' "$REQUEST" | grep -q .; then
            echo "Invalid STAGE8N request syntax" >&2
            cat "$REQUEST" >&2
            exit 3
          fi
          source "$REQUEST"
          if [ -z "${SEED_RELEASE_TAG:-}" ] || ! [[ "${SEED_ZIP_SHA256:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid seed request metadata" >&2
            exit 4
          fi
          echo "SEED_RELEASE_TAG=$SEED_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "EXPECTED_SEED_ZIP_SHA256=$SEED_ZIP_SHA256" >> "$GITHUB_ENV"
          EXPECTED_TOOLING_REF="$(git rev-parse "$GITHUB_SHA^")"
          echo "EXPECTED_TOOLING_REF=$EXPECTED_TOOLING_REF" >> "$GITHUB_ENV"

      - name: Static safety audit
        shell: bash
        run: |
          set -o pipefail
          python3 -m py_compile \
            tb8504-build/scripts/audit-cloud-seed.py \
            tb8504-build/scripts/audit-stage8n.py \
            tb8504-build/scripts/audit-runtime-contracts.py \
            tb8504-build/scripts/apply-runtime-cleanup.py \
            tb8504-build/scripts/apply-residual-cleanup.py \
            tb8504-build/scripts/audit-residual-contracts.py \
            tb8504-build/scripts/apply-product-compat.py \
            tb8504-build/scripts/audit-product-compat.py \
            tb8504-build/scripts/apply-performance-compat.py \
            tb8504-build/scripts/audit-performance-compat.py \
            tb8504-build/scripts/apply-residual-cleanup.py \
            tb8504-build/scripts/audit-residual-contracts.py \
            tb8504-build/scripts/apply-product-compat.py \
            tb8504-build/scripts/audit-product-compat.py
          ! grep -RniE '(^|[[:space:]])(adb|fastboot)[[:space:]]' \
            tb8504-build/scripts/audit-stage8n.py \
            tb8504-build/scripts/audit-runtime-contracts.py \
            tb8504-build/scripts/apply-runtime-cleanup.py \
            tb8504-build/scripts/apply-residual-cleanup.py \
            tb8504-build/scripts/audit-residual-contracts.py \
            tb8504-build/scripts/apply-product-compat.py \
            tb8504-build/scripts/audit-product-compat.py \
            tb8504-build/scripts/apply-performance-compat.py \
            tb8504-build/scripts/audit-performance-compat.py \
            tb8504-build/config/stage8n.env
          ! grep -RniE '/dev/(block|snd)|dd[[:space:]].*of=/dev/' \
            tb8504-build/scripts/audit-stage8n.py \
            tb8504-build/scripts/audit-runtime-contracts.py \
            tb8504-build/scripts/apply-runtime-cleanup.py

      - name: Download private audited seed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/tb8504-stage8n/seed
          gh release view "$SEED_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName \
            --jq '.isDraft, .tagName' |
            tee /tmp/tb8504-stage8n/release-info.txt
          grep -Fx 'true' /tmp/tb8504-stage8n/release-info.txt
          grep -Fx "$SEED_RELEASE_TAG" /tmp/tb8504-stage8n/release-info.txt
          gh release download "$SEED_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'TB8504_CLOUD_SEED_*.zip' \
            --dir /tmp/tb8504-stage8n/seed
          mapfile -t SEEDS < <(find /tmp/tb8504-stage8n/seed -maxdepth 1 -type f -name 'TB8504_CLOUD_SEED_*.zip' -print)
          if [ "${#SEEDS[@]}" -ne 1 ]; then
            echo "Expected exactly one seed ZIP; found ${#SEEDS[@]}" >&2
            exit 5
          fi
          ACTUAL="$(sha256sum "${SEEDS[0]}" | awk '{print $1}')"
          [ "$ACTUAL" = "$EXPECTED_SEED_ZIP_SHA256" ] || {
            echo "Seed SHA256 mismatch" >&2
            exit 6
          }
          echo "SEED_ZIP=${SEEDS[0]}" >> "$GITHUB_ENV"

      - name: Re-audit seed and extract exported state
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/tb8504-stage8n/reconstructed /tmp/tb8504-stage8n/report
          python3 tb8504-build/scripts/audit-cloud-seed.py "$SEED_ZIP" \
            2>&1 | tee /tmp/tb8504-stage8n/report/seed-audit.txt
          SEED_RC=${PIPESTATUS[0]}
          [ "$SEED_RC" -eq 0 ] || exit "$SEED_RC"
          grep -Fx "SEED_TOOLING_REF=$EXPECTED_TOOLING_REF" /tmp/tb8504-stage8n/report/seed-audit.txt
          python3 - "$SEED_ZIP" /tmp/tb8504-stage8n/reconstructed <<'PY'
          import sys, tarfile, zipfile
          from pathlib import Path
          seed = Path(sys.argv[1])
          root = Path(sys.argv[2])
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(seed) as z:
              for name in (
                  "device_lenovo_TB8504.tar.gz",
                  "patches/device__lenovo__TB8504.patch",
                  "patches/vendor__lenovo__TB8504.patch",
                  "meta/primary-source-state.json",
                  "meta/module-info.json",
              ):
                  (root / Path(name).name).write_bytes(z.read(name))
          device_tar_root = root / "device-tar"
          device_tar_root.mkdir(exist_ok=True)
          with tarfile.open(root / "device_lenovo_TB8504.tar.gz", "r:gz") as tf:
              tf.extractall(device_tar_root)
          PY
          test -f /tmp/tb8504-stage8n/reconstructed/device-tar/TB8504/BoardConfig.mk
          test -f /tmp/tb8504-stage8n/reconstructed/device__lenovo__TB8504.patch
          test -f /tmp/tb8504-stage8n/reconstructed/vendor__lenovo__TB8504.patch
          test -f /tmp/tb8504-stage8n/reconstructed/primary-source-state.json
          test -f /tmp/tb8504-stage8n/reconstructed/module-info.json

      - name: Reconstruct exact patched device tree
        shell: bash
        run: |
          set -euo pipefail
          source tb8504-build/config/stage8n.env
          DEVICE=/tmp/tb8504-stage8n/reconstructed/device/TB8504
          mkdir -p "$(dirname "$DEVICE")"
          git init -q "$DEVICE"
          git -C "$DEVICE" remote add origin "$DEVICE_REPO"
          git -C "$DEVICE" fetch -q --depth 1 origin "$DEVICE_SHA"
          git -C "$DEVICE" checkout -q --detach FETCH_HEAD
          ACTUAL="$(git -C "$DEVICE" rev-parse HEAD)"
          [ "$ACTUAL" = "$DEVICE_SHA" ] || {
            echo "Device baseline mismatch: $ACTUAL != $DEVICE_SHA" >&2
            exit 9
          }

          DEVICE_PATCH=/tmp/tb8504-stage8n/reconstructed/device__lenovo__TB8504.patch
          if [ -s "$DEVICE_PATCH" ]; then
            git -C "$DEVICE" apply --check "$DEVICE_PATCH"
            git -C "$DEVICE" apply "$DEVICE_PATCH"
          fi

          python3 - "$SEED_ZIP" "$DEVICE" <<'PY'
          import sys, zipfile
          from pathlib import Path
          seed = Path(sys.argv[1])
          device = Path(sys.argv[2]).resolve()
          prefix = "untracked/device/lenovo/TB8504/"
          with zipfile.ZipFile(seed) as z:
              for name in z.namelist():
                  if not name.startswith(prefix) or name.endswith("/"):
                      continue
                  rel = Path(name[len(prefix):])
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"unsafe device untracked path: {name}")
                  dst = (device / rel).resolve()
                  if device not in dst.parents:
                      raise SystemExit(f"device untracked path escapes tree: {name}")
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  dst.write_bytes(z.read(name))
                  mode=(z.getinfo(name).external_attr >> 16) & 0o7777
                  dst.chmod(mode)
          PY

          EXPECTED_PATCH_SHA="$(python3 - <<'PY'
          import json
          p=json.load(open("/tmp/tb8504-stage8n/reconstructed/primary-source-state.json"))
          print(p["device/lenovo/TB8504"]["patch_sha256"])
          PY
          )"
          ACTUAL_PATCH_SHA="$(git -C "$DEVICE" diff --binary HEAD | sha256sum | awk '{print $1}')"
          [ "$ACTUAL_PATCH_SHA" = "$EXPECTED_PATCH_SHA" ] || {
            echo "Device reconstructed patch mismatch: $ACTUAL_PATCH_SHA != $EXPECTED_PATCH_SHA" >&2
            exit 9
          }

          diff -qr --exclude=.git \
            /tmp/tb8504-stage8n/reconstructed/device-tar/TB8504 \
            "$DEVICE"
          python3 - \
            /tmp/tb8504-stage8n/reconstructed/device-tar/TB8504 \
            "$DEVICE" <<'PY'
          import hashlib, os, sys
          from pathlib import Path

          def manifest(root):
              root=Path(root)
              rows=[]
              for p in sorted(
                  root.rglob("*"),
                  key=lambda x:x.relative_to(root).as_posix(),
              ):
                  rel=p.relative_to(root).as_posix()
                  if rel == ".git" or rel.startswith(".git/"):
                      continue
                  st=p.lstat()
                  mode=st.st_mode & 0o7777
                  if p.is_symlink():
                      rows.append((rel,"L",mode,os.readlink(p)))
                  elif p.is_file():
                      h=hashlib.sha256(p.read_bytes()).hexdigest()
                      rows.append((rel,"F",mode,st.st_size,h))
                  elif p.is_dir():
                      rows.append((rel,"D",mode))
                  else:
                      raise SystemExit(f"unsupported device tree entry: {p}")
              return rows

          left=manifest(sys.argv[1])
          right=manifest(sys.argv[2])
          if left != right:
              for i in range(min(len(left),len(right))):
                  if left[i] != right[i]:
                      raise SystemExit(
                          f"device tree metadata mismatch at {i}: "
                          f"{left[i]!r} != {right[i]!r}"
                      )
              raise SystemExit(
                  f"device tree manifest length mismatch: "
                  f"{len(left)} != {len(right)}"
              )
          print(f"DEVICE_TREE_CANONICAL_ENTRIES={len(left)}")
          print("DEVICE_TREE_METADATA_BINDING=PASS")
          PY
          echo "DEVICE_RECONSTRUCTED_FROM_PROVENANCE=PASS" | \
            tee -a /tmp/tb8504-stage8n/report/STATUS.txt
          echo "DEVICE_TAR_PROVENANCE_BINDING=PASS" | \
            tee -a /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Reconstruct exact patched vendor tree
        shell: bash
        run: |
          set -o pipefail
          source tb8504-build/config/stage8n.env
          VENDOR=/tmp/tb8504-stage8n/reconstructed/vendor
          git init -q "$VENDOR"
          git -C "$VENDOR" remote add origin "$VENDOR_REPO"
          git -C "$VENDOR" fetch -q --depth 1 origin "$VENDOR_SHA"
          git -C "$VENDOR" checkout -q --detach FETCH_HEAD
          ACTUAL="$(git -C "$VENDOR" rev-parse HEAD)"
          [ "$ACTUAL" = "$VENDOR_SHA" ] || {
            echo "Vendor baseline mismatch: $ACTUAL != $VENDOR_SHA" >&2
            exit 10
          }
          git -C "$VENDOR" apply --check /tmp/tb8504-stage8n/reconstructed/vendor__lenovo__TB8504.patch
          git -C "$VENDOR" apply /tmp/tb8504-stage8n/reconstructed/vendor__lenovo__TB8504.patch
          git -C "$VENDOR" status --short | tee /tmp/tb8504-stage8n/report/vendor-status.txt
          grep -Fx ' M TB8504-vendor.mk' /tmp/tb8504-stage8n/report/vendor-status.txt
          test "$(wc -l < /tmp/tb8504-stage8n/report/vendor-status.txt)" -eq 1

      - name: Audit inherited IMS SELinux baseline
        shell: bash
        run: |
          set -o pipefail
          source tb8504-build/config/stage8n.env
          SEPOLICY=/tmp/tb8504-stage8n/sepolicy
          git init -q "$SEPOLICY"
          git -C "$SEPOLICY" remote add origin "$SEPOLICY_AUDIT_REPO"
          git -C "$SEPOLICY" fetch -q --depth 1 origin "$SEPOLICY_AUDIT_SHA"
          git -C "$SEPOLICY" checkout -q --detach FETCH_HEAD
          test "$(git -C "$SEPOLICY" rev-parse HEAD)" = "$SEPOLICY_AUDIT_SHA"

          FC="$SEPOLICY/legacy/vendor/common/file_contexts"
          grep -F '/(vendor|system/vendor)/bin/imsdatadaemon       u:object_r:ims_exec:s0' "$FC"
          grep -F '/(vendor|system/vendor)/bin/imsqmidaemon        u:object_r:ims_exec:s0' "$FC"
          grep -F '/(vendor|system/vendor)/bin/ims_rtp_daemon      u:object_r:hal_imsrtp_exec:s0' "$FC"
          grep -F '/(vendor|system/vendor)/bin/imsrcsd             u:object_r:hal_rcsservice_exec:s0' "$FC"

          grep -F 'init_daemon_domain(ims)' "$SEPOLICY/legacy/vendor/common/ims.te"
          grep -F 'init_daemon_domain(hal_imsrtp)' "$SEPOLICY/legacy/vendor/common/hal_imsrtp.te"
          grep -F 'init_daemon_domain(hal_rcsservice)' "$SEPOLICY/legacy/vendor/common/hal_rcsservice.te"

          {
            echo "SEPOLICY_AUDIT_SHA=$SEPOLICY_AUDIT_SHA"
            echo "IMS_SEPOLICY_BASELINE=PASS"
          } >> /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Apply audited runtime cleanup overlay
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/apply-runtime-cleanup.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --patch-out /tmp/tb8504-stage8n/report/device-runtime-cleanup.patch \
            --report-out /tmp/tb8504-stage8n/report/runtime-cleanup.txt \
            2>&1 | tee /tmp/tb8504-stage8n/report/runtime-cleanup.log

      - name: Apply residual cross-layer cleanup
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/apply-residual-cleanup.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --vendor /tmp/tb8504-stage8n/reconstructed/vendor \
            --patch-out /tmp/tb8504-stage8n/report/residual-cleanup.patch \
            --report-out /tmp/tb8504-stage8n/report/residual-cleanup.txt \
            2>&1 | tee /tmp/tb8504-stage8n/report/residual-cleanup.log
          RC=${PIPESTATUS[0]}
          echo "RESIDUAL_CLEANUP_RC=$RC" >> /tmp/tb8504-stage8n/report/STATUS.txt
          exit "$RC"

      - name: Verify residual cleanup idempotency
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/apply-residual-cleanup.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --vendor /tmp/tb8504-stage8n/reconstructed/vendor \
            --patch-out /tmp/tb8504-stage8n/report/residual-cleanup-second.patch \
            --report-out /tmp/tb8504-stage8n/report/residual-cleanup-second.txt \
            2>&1 | tee /tmp/tb8504-stage8n/report/residual-cleanup-second.log
          RC=${PIPESTATUS[0]}
          [ "$RC" -eq 0 ] || exit "$RC"
          grep -Fx 'RESIDUAL_CLEANUP_STATE=ALREADY_APPLIED' /tmp/tb8504-stage8n/report/residual-cleanup-second.txt
          grep -Fx 'CHANGED_FILES=0' /tmp/tb8504-stage8n/report/residual-cleanup-second.txt
          test ! -s /tmp/tb8504-stage8n/report/residual-cleanup-second.patch
          echo "RESIDUAL_IDEMPOTENCY=PASS" >> /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Migrate Android 16 product build overrides
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/apply-product-compat.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --patch-out /tmp/tb8504-stage8n/report/product-compat.patch \
            --report-out /tmp/tb8504-stage8n/report/product-compat.txt \
            2>&1 | tee /tmp/tb8504-stage8n/report/product-compat.log
          RC=${PIPESTATUS[0]}
          echo "PRODUCT_COMPAT_RC=$RC" >> /tmp/tb8504-stage8n/report/STATUS.txt
          exit "$RC"

      - name: Verify product compatibility idempotency
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/apply-product-compat.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --patch-out /tmp/tb8504-stage8n/report/product-compat-second.patch \
            --report-out /tmp/tb8504-stage8n/report/product-compat-second.txt \
            2>&1 | tee /tmp/tb8504-stage8n/report/product-compat-second.log
          RC=${PIPESTATUS[0]}
          [ "$RC" -eq 0 ] || exit "$RC"
          grep -Fx 'PRODUCT_COMPAT_STATE=ALREADY_APPLIED' /tmp/tb8504-stage8n/report/product-compat-second.txt
          test ! -s /tmp/tb8504-stage8n/report/product-compat-second.patch
          echo "PRODUCT_COMPAT_IDEMPOTENCY=PASS" >> /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Audit Android 16 product build overrides
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/audit-product-compat.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            2>&1 | tee /tmp/tb8504-stage8n/report/product-compat-audit.log
          RC=${PIPESTATUS[0]}
          echo "PRODUCT_COMPAT_AUDIT_RC=$RC" >> /tmp/tb8504-stage8n/report/STATUS.txt
          exit "$RC"

      - name: Apply Android 16 low-end graphics compatibility
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/apply-performance-compat.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --patch-out /tmp/tb8504-stage8n/report/performance-compat.patch \
            --report-out /tmp/tb8504-stage8n/report/performance-compat.txt \
            2>&1 | tee /tmp/tb8504-stage8n/report/performance-compat.log
          RC=${PIPESTATUS[0]}
          echo "PERFORMANCE_COMPAT_RC=$RC" >> /tmp/tb8504-stage8n/report/STATUS.txt
          exit "$RC"

      - name: Verify performance compatibility idempotency
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/apply-performance-compat.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --patch-out /tmp/tb8504-stage8n/report/performance-compat-second.patch \
            --report-out /tmp/tb8504-stage8n/report/performance-compat-second.txt \
            2>&1 | tee /tmp/tb8504-stage8n/report/performance-compat-second.log
          RC=${PIPESTATUS[0]}
          [ "$RC" -eq 0 ] || exit "$RC"
          grep -Fx 'PERFORMANCE_COMPAT_STATE=ALREADY_APPLIED' /tmp/tb8504-stage8n/report/performance-compat-second.txt
          grep -Fx 'CHANGED_FILES=0' /tmp/tb8504-stage8n/report/performance-compat-second.txt
          test ! -s /tmp/tb8504-stage8n/report/performance-compat-second.patch
          echo "PERFORMANCE_COMPAT_IDEMPOTENCY=PASS" >> /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Audit Android 16 low-end graphics contract
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/audit-performance-compat.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            2>&1 | tee /tmp/tb8504-stage8n/report/performance-compat-audit.log
          RC=${PIPESTATUS[0]}
          echo "PERFORMANCE_COMPAT_AUDIT_RC=$RC" >> /tmp/tb8504-stage8n/report/STATUS.txt
          exit "$RC"

      - name: Prove residual cleanup idempotence
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/apply-residual-cleanup.py \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --vendor /tmp/tb8504-stage8n/reconstructed/vendor \
            --patch-out /tmp/tb8504-stage8n/report/residual-idempotence.patch \
            --report-out /tmp/tb8504-stage8n/report/residual-idempotence.txt \
            2>&1 | tee /tmp/tb8504-stage8n/report/residual-idempotence.log
          grep -Fx 'RESIDUAL_CLEANUP_STATE=ALREADY_APPLIED' /tmp/tb8504-stage8n/report/residual-idempotence.txt
          grep -Fx 'IMS_SERVICES_RESTORED=0' /tmp/tb8504-stage8n/report/residual-idempotence.txt
          grep -Fx 'DEAD_CONTROL_REFS_REMOVED=0' /tmp/tb8504-stage8n/report/residual-idempotence.txt
          grep -Fx 'CHANGED_FILES=0' /tmp/tb8504-stage8n/report/residual-idempotence.txt
          test ! -s /tmp/tb8504-stage8n/report/residual-idempotence.patch
          echo "RESIDUAL_IDEMPOTENCE=PASS" >> /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Validate transformed device shell syntax
        shell: bash
        run: |
          set -o pipefail
          DEVICE=/tmp/tb8504-stage8n/reconstructed/device/TB8504
          for FILE in \
            "$DEVICE/rootdir/etc/init.class_main.sh" \
            "$DEVICE/rootdir/etc/init.qcom.post_boot.sh" \
            "$DEVICE/rootdir/etc/init.qcom.sensors.sh" \
            "$DEVICE/rootdir/etc/init.qcom.sh"; do
            echo "BASH_N=$FILE"
            bash -n "$FILE"
          done
          echo "TRANSFORMED_SHELL_SYNTAX=PASS" >> /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Audit post-cleanup ELF dependency graph
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/audit-stage8n.py \
            --vendor /tmp/tb8504-stage8n/reconstructed/vendor \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --report-dir /tmp/tb8504-stage8n/report \
            2>&1 | tee /tmp/tb8504-stage8n/report/FULL.log
          RC=${PIPESTATUS[0]}
          echo "STAGE8N_AUDIT_RC=$RC" | tee -a /tmp/tb8504-stage8n/report/STATUS.txt
          exit "$RC"

      - name: Audit runtime init and VINTF contracts
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/audit-runtime-contracts.py \
            --vendor /tmp/tb8504-stage8n/reconstructed/vendor \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            --report-dir /tmp/tb8504-stage8n/report \
            2>&1 | tee /tmp/tb8504-stage8n/report/runtime-contracts.log
          echo "RUNTIME_MODULE_INFO_MODE=SOURCE_ONLY" | tee -a /tmp/tb8504-stage8n/report/STATUS.txt
          RC=${PIPESTATUS[0]}
          echo "RUNTIME_CONTRACT_AUDIT_RC=$RC" >> /tmp/tb8504-stage8n/report/STATUS.txt
          exit "$RC"

      - name: Audit residual cross-layer contracts
        shell: bash
        run: |
          set -o pipefail
          python3 tb8504-build/scripts/audit-residual-contracts.py \
            --vendor /tmp/tb8504-stage8n/reconstructed/vendor \
            --device /tmp/tb8504-stage8n/reconstructed/device/TB8504 \
            2>&1 | tee /tmp/tb8504-stage8n/report/residual-contracts.log
          RC=${PIPESTATUS[0]}
          echo "RESIDUAL_CONTRACT_AUDIT_RC=$RC" >> /tmp/tb8504-stage8n/report/STATUS.txt
          exit "$RC"

      - name: Prepare audited provenance acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 tb8504-build/scripts/accept-converged-provenance.py \
            --seed "$SEED_ZIP" \
            --knowledge tb8504-build/config/autopilot-knowledge.json \
            --out /tmp/tb8504-stage8n/report/autopilot-knowledge.accepted.json \
            --release-tag "$SEED_RELEASE_TAG" \
            --request-commit "$GITHUB_SHA" \
            --tooling-ref "$EXPECTED_TOOLING_REF" \
            2>&1 | tee /tmp/tb8504-stage8n/report/provenance-acceptance.log
          grep -Fx 'PROVENANCE_ACCEPTANCE_CANDIDATE=PASS' \
            /tmp/tb8504-stage8n/report/provenance-acceptance.log
          echo "PROVENANCE_ACCEPTANCE_CANDIDATE=PASS" >> /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Commit audited provenance acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" \
            --jq '.commit.sha')"
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "Branch moved before provenance acceptance: $REMOTE_HEAD != $GITHUB_SHA" >&2
            exit 31
          fi

          cp /tmp/tb8504-stage8n/report/autopilot-knowledge.accepted.json \
            tb8504-build/config/autopilot-knowledge.json
          git diff --check -- tb8504-build/config/autopilot-knowledge.json
          if git diff --quiet -- tb8504-build/config/autopilot-knowledge.json; then
            echo "PROVENANCE_KNOWLEDGE_ALREADY_CURRENT=YES" | \
              tee -a /tmp/tb8504-stage8n/report/STATUS.txt
          else
            git config user.name "TB8504 Audit Bot"
            git config user.email "tb8504-audit@users.noreply.github.com"
            git add tb8504-build/config/autopilot-knowledge.json
            git commit -m "tb8504: accept audited converge provenance"
            git push origin "HEAD:$GITHUB_REF_NAME"
            ACCEPT_COMMIT="$(git rev-parse HEAD)"
            echo "PROVENANCE_ACCEPT_COMMIT=$ACCEPT_COMMIT" | \
              tee -a /tmp/tb8504-stage8n/report/STATUS.txt
          fi
          echo "PROVENANCE_KNOWLEDGE_PROMOTION=PASS" | \
            tee -a /tmp/tb8504-stage8n/report/STATUS.txt

      - name: Publish STAGE8N summary
        if: always()
        shell: bash
        run: |
          echo '## TB8504 STAGE8N source ELF audit' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          [ ! -f /tmp/tb8504-stage8n/report/FULL.log ] || tail -n 160 /tmp/tb8504-stage8n/report/FULL.log >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/tb8504-stage8n/report/runtime-contracts.log ]; then
            echo '## Runtime contract audit' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 /tmp/tb8504-stage8n/report/runtime-contracts.log >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/tb8504-stage8n/report/residual-contracts.log ]; then
            echo '## Residual cross-layer audit' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 200 /tmp/tb8504-stage8n/report/residual-contracts.log >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/tb8504-stage8n/report/product-compat-audit.log ]; then
            echo '## Android 16 product compatibility audit' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/tb8504-stage8n/report/product-compat-audit.log >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/tb8504-stage8n/report/performance-compat-audit.log ]; then
            echo '## Android 16 low-end graphics audit' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/tb8504-stage8n/report/performance-compat-audit.log >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload STAGE8N audit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4b
        with:
          name: TB8504-stage8n-audit-${{ github.run_number }}
          path: /tmp/tb8504-stage8n/report/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
